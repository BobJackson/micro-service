spring:
  application:
    name: attendance
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
        import-check:
          enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5432/attendance_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
server:
  port: 0
sa-token:
  token-name: Authorization
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: false
  max-login-count: -1
  token-style: uuid
  is-log: true

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus # 只暴露必要的端点
  endpoint:
    health:
      show-details: when-authorized # 仅授权时显示详细信息
      probes:
        enabled: true # 启用 K8s 健康检查探针
  prometheus:
    metrics:
      export:
        enabled: true

# OpenFeign 配置
spring.cloud.openfeign:
  client:
    config:
      default:
        connectTimeout: 5000    # 连接超时 5s
        readTimeout: 5000       # 读取超时 5s
      employee: # 服务名应与 employee 服务的 spring.application.name 一致
        connectTimeout: 3000    # employee 服务连接超时 3s
        readTimeout: 3000       # employee 服务读取超时 3s
  # 重试配置
  retryer:
    period: 100                 # 初始重试间隔 100ms
    maxPeriod: 1000             # 最大重试间隔 1s
    maxAttempts: 3              # 最大重试次数 3 次
