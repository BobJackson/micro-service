spring:
  application:
    name: employee
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
        import-check:
          enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5432/employee_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
server:
  port: 0
sa-token:
  token-name: Authorization
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: false
  max-login-count: -1
  token-style: uuid
  is-log: true

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus # 只暴露必要的端点
  endpoint:
    health:
      show-details: when-authorized # 仅授权时显示详细信息
      probes:
        enabled: true # 启用 K8s 健康检查探针
  prometheus:
    metrics:
      export:
        enabled: true
